apiVersion: batch/v1
kind: Job
metadata:
  name: model-training
  namespace: ml-training
spec:
  backoffLimit: 1

  template:
    metadata:
      labels:
        app: model-training

    spec:
      restartPolicy: Never

      containers:
        - name: trainer
          image: mlops-train:latest
          imagePullPolicy: Never

          resources:
            requests:
              cpu: "2"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "4Gi"

          volumeMounts:
            - name: training-config
              mountPath: /app/configs
              readOnly: true

            - name: data-storage
              mountPath: /app/data

            - name: checkpoint-storage
              mountPath: /app/checkpoints

      volumes:
        - name: training-config
          configMap:
            name: training-config

        - name: data-storage
          persistentVolumeClaim:
            claimName: data-pvc

        - name: checkpoint-storage
          persistentVolumeClaim:
            claimName: checkpoint-pvc
